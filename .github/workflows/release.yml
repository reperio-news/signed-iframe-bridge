name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  check-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq '.check_runs[] | select(.name | test("test \\(")) | {name, conclusion}' \
            | tee /dev/stderr
          FAILED=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq '[.check_runs[] | select(.name | test("test \\(")) | select(.conclusion != "success")] | length')
          TOTAL=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq '[.check_runs[] | select(.name | test("test \\("))] | length')
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No CI check runs found for this commit. Push to main first."
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::CI checks have not all passed for this commit."
            exit 1
          fi

  test:
    needs: check-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # idempotent: registries refuse republishing a version, so a re-run of a
      # partially failed release must skip what already landed
      - name: Publish (skip if version already on npmjs)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@reperio-news/signed-iframe-bridge@${V}" version >/dev/null 2>&1; then
            echo "::notice::${V} already published to npmjs - skipping"
            exit 0
          fi
          npm publish --provenance --access public

  publish-gpr:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - name: Publish (skip if version already on GitHub Packages)
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@reperio-news/signed-iframe-bridge@${V}" version >/dev/null 2>&1; then
            echo "::notice::${V} already published to GitHub Packages - skipping"
            exit 0
          fi
          npm publish --access public

  github-release:
    needs: [publish-npm, publish-gpr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release (skip if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::notice::release ${{ github.ref_name }} already exists - skipping"
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
